<template>
    <lightning-card title="Setup Audit Package Generator" icon-name="custom:custom63">
        <div class="slds-p-around_medium">

            <div class="filters slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input name="section" label="Section contains" value={sectionFilter}
                        placeholder="e.g. Apex Classes" minlength="3" maxlength="100" onchange={handleSectionChange}
                        data-id="sectionInput">
                    </lightning-input>
                    <p class="helper-text">Enter at least 3 characters to enable filter. Leave blank to load all.</p>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input name="keyword" label="Keyword (in Display)" value={keywordFilter}
                        placeholder="e.g. Created LeadProcessor" minlength="3" maxlength="100"
                        onchange={handleKeywordChange} data-id="keywordInput">
                    </lightning-input>
                    <p class="helper-text">Searches the 'Display' text. Enter 3+ chars to filter.</p>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-m-top_small slds-grid slds-grid_align-end">
                    <lightning-button variant="neutral" label="Clear" onclick={clearFilters} class="slds-m-right_small">
                    </lightning-button>

                    <lightning-button variant="brand" label="Apply Filters" onclick={applyFilters}
                        disabled={isApplyDisabled} title="Enable when a filter has 3+ characters">
                    </lightning-button>
                </div>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-align_absolute-center slds-grid slds-grid_align-center">
                    <lightning-spinner alternative-text="Loading audit entries..." size="medium"></lightning-spinner>
                </div>
            </template>

            <div class="slds-p-top_small" style="height: 500px; overflow-y: auto;">
                <lightning-datatable key-field="id" data={pagedRows} columns={columns}
                    hide-checkbox-column={hideCheckboxColumn} onrowselection={handleRowSelection}
                    onloadmore={loadMoreData} enable-infinite-loading is-loading={isLoadingLazy}>
                </lightning-datatable>
            </div>

            <div class="slds-m-top_large slds-align_absolute-center action-row">
                <lightning-button label="Generate XML" onclick={generatePackage} disabled={disableGenerateButton}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>

    <template lwc:if={showDownloadModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Confirm Package Download</h2>
                </div>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>The <strong>package.xml</strong> file has been generated successfully. Do you want to download
                        the file now?
                    </p>
                    <p class="slds-m-top_small slds-text-color_weak slds-text-body_small">Filename: package.xml
                        (XML/Text)</p>

                    <div class="slds-m-top_medium slds-border_bottom slds-border_top slds-p-vertical_x-small">
                        <p class="slds-text-title_bold slds-m-bottom_x-small">Generated XML:</p>
                        <div class="xml-code-container">
                            <pre class="xml-code">{prettyXmlContent}</pre>
                        </div>
                    </div>
                </div>

                <div class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Download XML" onclick={confirmDownload}
                        class="slds-m-left_small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
